name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "App version: $APP_VERSION"
          echo "Tag version: $TAG_VERSION"
          test "$APP_VERSION" = "$TAG_VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Configure Android signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              printf '%s\n' 'RELEASE_STORE_FILE=release.keystore'
              printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
              printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            } > android/keystore.properties
            echo 'Using production signing configuration.'
          else
            cp android/app/debug.keystore android/app/release.keystore
            cat > android/keystore.properties <<'PROPERTIES'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=android
          RELEASE_KEY_ALIAS=androiddebugkey
          RELEASE_KEY_PASSWORD=android
          PROPERTIES
            echo 'Production signing secrets are absent; using the debug keystore fallback.'
          fi
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Build release APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --parallel --build-cache

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release -type f -name '*.apk' -print -exec cp {} dist/ \;
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-${{ github.ref_name }}-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
